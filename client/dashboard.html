<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body>

  <h1>Welcome to Dashboard</h1>

  <p id="userCode"></p>

  <script>
    let code = localStorage.getItem("lab_code");

    if (!code) {
      window.location.href = "login.html";
    }

    document.getElementById("userCode").innerText =
      "Your Code: " + code;
  </script>

</body>
</html>
